# =============================================================================
# Face Recognition Attendance System - Docker Compose
# =============================================================================
# Orchestrates the application with optional Nginx reverse proxy.
#
# Usage:
#   docker compose up -d                    # Start all services
#   docker compose up -d app                # Start app only
#   docker compose logs -f app              # View app logs
#   docker compose down                     # Stop all services
#
# For camera access on Linux, add to 'app' service:
#   devices:
#     - /dev/video0:/dev/video0
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Flask Application
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendance-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # Persist database and face data across container restarts
      - app-data:/app/data
      - ./data/known_faces:/app/data/known_faces
      - ./data/embeddings:/app/data/embeddings
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - ATTENDANCE_DB_PATH=/app/data/attendance.db
      - RATE_LIMIT_ENABLED=true
      - CACHE_ENABLED=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - attendance-net
    # Uncomment for camera access on Linux:
    # devices:
    #   - /dev/video0:/dev/video0

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy (optional)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: attendance-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/usr/share/nginx/static:ro
      # Uncomment and configure for SSL:
      # - ./nginx/ssl/cert.pem:/etc/nginx/ssl/cert.pem:ro
      # - ./nginx/ssl/key.pem:/etc/nginx/ssl/key.pem:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - attendance-net

volumes:
  app-data:
    driver: local

networks:
  attendance-net:
    driver: bridge
