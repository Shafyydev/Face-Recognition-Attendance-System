# =============================================================================
# Face Recognition Attendance System - Nginx Configuration
# =============================================================================
# Reverse proxy + load balancer configuration for production deployment.
#
# Features:
#   - Reverse proxy to Flask backend
#   - Load balancing across multiple Flask workers (round-robin)
#   - Static file serving with caching
#   - Rate limiting at the proxy level
#   - Security headers
#   - WebSocket support for MJPEG video streams
#   - Gzip compression
#   - SSL termination (placeholder — uncomment and add certs)
#
# Usage:
#   docker compose up nginx
#   OR
#   nginx -c /path/to/nginx.conf
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -------------------------------------------------------------------------
    # Logging
    # -------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # -------------------------------------------------------------------------
    # Performance
    # -------------------------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # -------------------------------------------------------------------------
    # Load Balancing - Upstream Flask Workers
    # -------------------------------------------------------------------------
    # For multi-worker deployment, add more server entries.
    # Strategies: round-robin (default), least_conn, ip_hash
    #
    # Scale Flask workers with:
    #   gunicorn -w 4 -b 0.0.0.0:5000 app:app
    # OR
    #   docker compose up --scale app=3
    # -------------------------------------------------------------------------
    upstream flask_backend {
        # Load balancing strategy (uncomment one):
        # least_conn;             # Route to least busy worker
        # ip_hash;                # Sticky sessions by client IP

        server app:5000;          # Docker service name
        # server app-2:5000;      # Additional workers
        # server app-3:5000;

        keepalive 32;             # Keep connections alive to backend
    }

    # -------------------------------------------------------------------------
    # Rate Limiting Zones
    # -------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_register:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=api_write:10m rate=10r/s;

    # -------------------------------------------------------------------------
    # Main Server Block (HTTP)
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name localhost;

        # Uncomment to redirect HTTP -> HTTPS:
        # return 301 https://$host$request_uri;

        # ----- Static Files (served directly by Nginx) -----
        location /static/ {
            alias /usr/share/nginx/static/;
            expires 7d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ----- Video Feed (MJPEG stream — long-lived connection) -----
        location /video_feed {
            proxy_pass http://flask_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            chunked_transfer_encoding off;
        }

        location /registration_feed {
            proxy_pass http://flask_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        # ----- API: Registration (strict rate limit) -----
        location /api/register {
            limit_req zone=api_register burst=3 nodelay;

            proxy_pass http://flask_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }

        # ----- API: Write Operations (moderate rate limit) -----
        location ~ ^/api/(clear_today|attendance/manual|set_attendance_date|students) {
            limit_req zone=api_write burst=5 nodelay;

            proxy_pass http://flask_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----- API: General Read Endpoints -----
        location /api/ {
            limit_req zone=api_general burst=20 nodelay;

            proxy_pass http://flask_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----- Health Check -----
        location /api/health {
            proxy_pass http://flask_backend;
            access_log off;
        }

        # ----- All Other Routes (dashboard, register page) -----
        location / {
            proxy_pass http://flask_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Security headers
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # ----- Custom Error Pages -----
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }

    # -------------------------------------------------------------------------
    # HTTPS Server Block (Uncomment and configure SSL)
    # -------------------------------------------------------------------------
    # server {
    #     listen 443 ssl http2;
    #     server_name attendance.example.com;
    #
    #     ssl_certificate     /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #
    #     # Add HSTS header
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     # ... (copy location blocks from above) ...
    # }
}
